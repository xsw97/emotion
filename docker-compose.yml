version: '3.8'

services:
  garden:
    build: .
    container_name: emotion-garden
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - COZE_PROJECT_ENV=PROD
      # ⚠️ 请替换为你的真实 Supabase 配置
      - NEXT_PUBLIC_SUPABASE_URL=your_supabase_url
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=your_supabase_anon_key
    restart: unless-stopped
    # 可选：挂载日志目录
    # volumes:
    #   - ./logs:/app/work/logs